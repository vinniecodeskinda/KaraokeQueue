<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karaoke — TV</title>
    <link rel="preconnect" href="https://www.youtube.com" />
  </head>
  <body class="host">
    <div id="app">
      <main class="stage">
        <div class="player-frame"><div id="player"></div></div>
        <div class="now-playing" id="now-playing" hidden>
          <span class="label">Now singing</span>
          <strong id="np-guest"></strong>
          <span id="np-song"></span>
        </div>
        <div class="idle" id="idle">
          <h1>🎤 Karaoke Night</h1>
          <p>Scan the QR code, or go to <b class="idle-site" id="idle-site"></b></p>
          <p>and enter room code</p>
          <div class="idle-code" id="idle-code"></div>
        </div>
      </main>

      <aside class="sidebar" id="sidebar">
        <header class="room-card">
          <canvas id="join-qr" width="132" height="132" aria-label="QR code to join this room"></canvas>
          <div class="room-info">
            <span class="label">Room code</span>
            <strong class="room-code" id="room-code"></strong>
            <button type="button" class="secondary small" id="copy-link">🔗 Copy join link</button>
          </div>
          <button type="button" class="icon-btn" id="collapse-btn" title="Hide sidebar (Q)" aria-label="Hide sidebar">⟩</button>
        </header>

        <details class="host-search" id="host-search">
          <summary>＋ Add a song</summary>
          <p class="adding-as">
            Adding as <b id="host-name"></b>
            <button type="button" class="link-btn" id="host-name-btn">change</button>
          </p>
          <div id="search"></div>
        </details>

        <section class="up-next">
          <h2>Up next <span class="count" id="up-next-count">0</span></h2>
          <ol id="up-next"></ol>
        </section>

        <footer class="host-controls">
          <button id="skip-btn" type="button" title="Skip this song">Skip ⏭</button>
          <span class="conn" id="conn" title="Realtime connection">●</span>
        </footer>
      </aside>

      <button type="button" class="show-sidebar" id="show-sidebar" title="Show queue (Q)" hidden>
        <span id="pill-code"></span> · <span id="pill-count">0</span> up next ☰
      </button>

      <div class="toast" id="toast" role="status" hidden></div>

      <div class="start-overlay" id="start-overlay">
        <h1>🎤 Your room is ready</h1>
        <p class="overlay-label">Room code</p>
        <p class="overlay-code" id="overlay-code"></p>
        <button id="start-btn" type="button">▶ Start the party</button>
        <p>Browsers require one click before videos can play with sound.</p>
      </div>

      <div class="gate" id="gate" hidden></div>
    </div>
    <script type="module" src="/src/host/main.js"></script>
  </body>
</html>
