<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0b1e" />
    <title>Karaoke Queue</title>
  </head>
  <body class="entry">
    <main id="app" class="entry-main">
      <header class="entry-hero">
        <div class="mic">🎤</div>
        <h1>Karaoke Queue</h1>
        <p>Play on the TV. Pick songs from your phone. No sign-up.</p>
      </header>

      <section class="entry-card" aria-labelledby="join-title">
        <h2 id="join-title">Join a party</h2>
        <form id="join-form" class="code-form" autocomplete="off">
          <input id="code-input" name="code" inputmode="text" autocapitalize="characters"
                 spellcheck="false" maxlength="5" placeholder="ROOM CODE" aria-label="Room code" />
          <button type="submit" id="join-btn">Join</button>
        </form>
        <p class="hint">Got a link or QR code? Just open it — you'll land straight in the room.</p>
      </section>

      <div class="or"><span>or</span></div>

      <section class="entry-card" aria-labelledby="host-title">
        <h2 id="host-title">Host a party</h2>
        <p class="hint">Open this on the TV or laptop that will play the videos.</p>
        <button type="button" id="host-btn" class="wide">Create a room</button>
        <div id="recent-rooms" class="recent" hidden></div>
      </section>

      <div class="toast" id="toast" role="status" hidden></div>
    </main>
    <script type="module" src="/src/entry/main.js"></script>
  </body>
</html>
